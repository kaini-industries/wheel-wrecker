name: Firmware

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.5.1"

      - name: Run native tests
        run: make test

      - name: Run sanitizer tests
        run: make test-sanitize

      - name: Test motor-demo runner
        run: make test-runner

      - name: Compile with PlatformIO
        run: make build PIO=pio

      - name: Compile with Arduino CLI profile
        run: make arduino-build
